<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nolfe — Time</title>
<link rel="preload" href="intro/manifest.json" as="fetch" crossorigin>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#still,#tb{position:fixed;inset:0;width:100%;height:100%;object-fit:contain}
#tb{touch-action:none;cursor:grab;outline:none}
#tb:active{cursor:grabbing}
/* Entrance */
#intro{position:fixed;inset:0;z-index:20;overflow:hidden;background:#000;touch-action:none;outline:none;-webkit-user-select:none;user-select:none;transition:opacity 140ms linear}
#intro.leaving{opacity:0}
#intro-canvas,#intro-video{position:absolute;inset:0;width:100%;height:100%;display:block}
#intro-video{object-fit:cover;display:none}
#intro.video-mode #intro-video{display:block}
#intro.video-mode #intro-canvas{display:none}
#intro-grain{position:absolute;left:0;top:0;width:calc(100% + 128px);height:calc(100% + 128px);pointer-events:none;mix-blend-mode:overlay;opacity:0}
#intro-hint{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));width:20px;height:30px;margin-left:-10px;color:#d5ece7;opacity:0;transition:opacity .9s ease;pointer-events:none}
#intro-hint.on{opacity:.5}
#intro:focus-visible #intro-hint.on{opacity:.95}
#intro-hint svg{display:block;width:100%;height:100%;animation:nolfe-nudge 2.6s ease-in-out infinite}
#intro-hint.wait svg{animation:nolfe-wait 1.1s ease-in-out infinite}
@keyframes nolfe-nudge{0%,100%{transform:translateY(5px);opacity:.45}50%{transform:translateY(-3px);opacity:1}}
@keyframes nolfe-wait{0%,100%{opacity:.3}50%{opacity:1}}
#skip-intro{position:fixed;z-index:30;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));background:none;border:0;padding:10px 8px;color:rgba(213,236,231,.42);font:11px/1 Arial,Helvetica,sans-serif;letter-spacing:.08em;cursor:pointer;opacity:0;transition:opacity .7s,color .2s}
#skip-intro.on{opacity:1}
#skip-intro:hover,#skip-intro:focus-visible{color:rgba(240,250,248,.92)}
#skip-intro:focus-visible{outline:1px solid rgba(240,250,248,.6);outline-offset:1px}
html[data-entry=crossing] #skip-intro,html[data-entry=inside] #skip-intro,html[data-entry=crossing] #sound-toggle,html[data-entry=inside] #sound-toggle{display:none}
#sound-toggle{position:fixed;z-index:30;left:calc(12px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:34px;height:31px;padding:7px 8px;background:none;border:0;color:rgba(213,236,231,.42);cursor:pointer;opacity:0;transition:opacity .9s ease,color .2s}
#sound-toggle.on{opacity:1}#sound-toggle:hover,#sound-toggle:focus-visible{color:rgba(240,250,248,.92)}#sound-toggle:focus-visible{outline:1px solid rgba(240,250,248,.6);outline-offset:1px}
#sound-toggle svg{display:block;width:100%;height:100%}#sound-toggle .waves{transition:opacity .2s}#sound-toggle.off .waves{opacity:0}#sound-toggle .slash{opacity:0}#sound-toggle.off .slash{opacity:1}
#sound-toggle.invite{animation:nolfe-invite 1.3s ease-in-out 2}@keyframes nolfe-invite{0%,100%{color:rgba(213,236,231,.42)}50%{color:rgba(240,250,248,1);transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){#sound-toggle{display:none}}
@media (prefers-reduced-motion:reduce){#intro-hint svg{animation:none}#intro{transition-duration:0s}}
#hud{position:fixed;left:8px;top:8px;z-index:99;margin:0;padding:6px 8px;background:rgba(0,0,0,.6);color:#9fe;font:11px/1.35 ui-monospace,Menlo,monospace;pointer-events:none;white-space:pre}
/* Production site chrome (from the live embed). Hidden for the whole entrance. */
#nolfe-overlay{position:fixed;inset:0;z-index:100;pointer-events:none;color:white;font:14px Arial,sans-serif}#nolfe-overlay header,#nolfe-overlay footer{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;transition:transform .25s,opacity .25s;pointer-events:auto;background:linear-gradient(#0009,transparent)}#nolfe-overlay header{top:0}#nolfe-overlay footer{bottom:0;background:linear-gradient(transparent,#0009);font-size:12px}#nolfe-overlay img{width:85px;height:70px;object-fit:contain}#nolfe-overlay nav{display:flex;gap:22px}#nolfe-overlay a{color:white;text-decoration:none}#nolfe-overlay.busy header{transform:translateY(-110%);opacity:0;pointer-events:none}#nolfe-overlay.busy footer{transform:translateY(110%);opacity:0;pointer-events:none}@media(max-width:480px){#nolfe-overlay header,#nolfe-overlay footer{padding:12px}#nolfe-overlay nav{gap:14px}#nolfe-overlay img{width:65px;height:54px}}@media(prefers-reduced-motion:reduce){#nolfe-overlay header,#nolfe-overlay footer{transition:none}}
html:not([data-entry=inside]) #nolfe-overlay{visibility:hidden}
</style></head><body>
